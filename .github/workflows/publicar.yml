# Prepara los datos más recientes, construye la app y la publica en
# https://gutiba7.github.io/traza-segura/
# Publica al aprobar cambios en main y cada mes el día 25 (la Secretaría publica el corte del mes
# anterior hacia el día 21). En las ramas de trabajo solo construye, para detectar errores antes de
# aprobar. Requiere GitHub Pages activado con "Source: GitHub Actions".
name: Publicar la app

on:
  push:
    branches: [main, "claude/**"]
  schedule:
    - cron: "17 6 25 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Mes actual (la descarga de calles se reutiliza durante el mes)
        id: mes
        run: echo "mes=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/osmnx
          key: calles-osm-${{ steps.mes.outputs.mes }}
      - name: Construir grafos de calles con riesgo
        run: python pipeline/construir_grafo.py web/public/data
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  desplegar:
    needs: construir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
