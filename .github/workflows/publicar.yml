# Prepara los datos más recientes, construye la app y la publica en
# https://gutiba7.github.io/traza-segura/
# Corre al aprobar cambios en main y cada mes el día 25 (la Secretaría publica el corte del mes
# anterior hacia el día 21). Requiere GitHub Pages activado con "Source: GitHub Actions".
name: Publicar la app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 25 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparar datos
        run: python3 pipeline/preparar_sectores.py web/public/data
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
